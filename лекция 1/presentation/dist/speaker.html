<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Текст лекции — пульт</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10231d;color:#f5f8f6;font:24px/1.6 system-ui}header{position:sticky;top:0;background:#10231df5;padding:18px 28px;border-bottom:1px solid #ffffff26;display:flex;align-items:center;gap:14px;flex-wrap:wrap}button,select{font:16px system-ui;border:0;border-radius:7px;padding:10px 14px;background:#ffdd2d;color:#003324;cursor:pointer}button:disabled{opacity:.35}label{margin-left:auto;font-size:14px;color:#b2c6c0}main{max-width:900px;margin:auto;padding:12px 32px 80px}p{margin:24px 0}#status{font-size:13px;color:#b2c6c0;flex-basis:100%}#error{color:#ffbc9b}input{width:90px}
</style>
<header><button id="prev" aria-label="Предыдущий слайд">←</button><select id="slide" aria-label="Слайд"></select><button id="next" aria-label="Следующий слайд">→</button><label>Размер текста <input id="size" type="range" min="18" max="40" value="24"></label><div id="status">Текст виден только здесь. Для записи в OBS выбери сцену «Презентация — слайды и камера».</div><div id="error" role="alert"></div></header><main id="notes"></main>
<script>
let slides=[],current=-1,busy=false;
const select=document.getElementById('slide'),content=document.getElementById('notes'),error=document.getElementById('error');
function render(index){if(index===current)return;current=index;select.value=String(index);content.replaceChildren(...slides[index].trim().split(/\n\s*\n/).map(text=>{const p=document.createElement('p');p.textContent=text;return p}));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;window.scrollTo(0,0)}
async function setSlide(index){if(busy||index<0||index>=slides.length)return;busy=true;try{const r=await fetch('/presenter-state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slide:index})});if(!r.ok)throw Error();render((await r.json()).slide);error.textContent=''}catch{error.textContent='Нет связи с сервером презентации.'}finally{busy=false}}
document.getElementById('prev').onclick=()=>setSlide(current-1);document.getElementById('next').onclick=()=>setSlide(current+1);select.onchange=()=>setSlide(Number(select.value));document.getElementById('size').oninput=e=>content.style.fontSize=e.target.value+'px';document.addEventListener('keydown',e=>{if(e.target.matches('select,input,button'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();setSlide(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();setSlide(current-1)}});
(async()=>{try{slides=(await(await fetch('/presenter-notes')).json()).slides;slides.forEach((_,i)=>select.add(new Option('Слайд '+(i+1)+' / '+slides.length,i)));render((await(await fetch('/presenter-state')).json()).slide);setInterval(async()=>{try{const r=await fetch('/presenter-state',{cache:'no-store'});if(!r.ok)throw Error();render((await r.json()).slide);error.textContent=''}catch{error.textContent='Нет связи с сервером презентации.'}},500)}catch{error.textContent='Не удалось загрузить текст. Запусти presenter.py.'}})();
</script></html>
